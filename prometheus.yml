global:
  scrape_interval: 1m

scrape_configs:
  - job_name: 'prometheus'
    scrape_interval: 1m
    static_configs:
      - targets: ['localhost:9090']

  - job_name: ''frontend''
    scrape_interval: 1m
    static_configs:
      - targets: ['localhost:3000']

  - job_name: 'backend'
    scrape_interval: 1m
    static_configs:
      - targets: ['localhost:5000']    
